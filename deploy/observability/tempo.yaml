# Tempo - trace store ("every step of every request"). Single-binary mode for the pilot;
# use the tempo-distributed chart with object storage (S3 / on-prem object store) in stages 2/3.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
storage:
  trace:
    backend: local
    local: {path: /var/tempo/traces}
    wal: {path: /var/tempo/wal}
compactor:
  compaction:
    block_retention: 336h   # 14 days; the audit log, not traces, is the long-term record
usage_report:
  reporting_enabled: false
