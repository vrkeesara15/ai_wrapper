# Grafana data sources: metrics, traces and logs, cross-linked by trace id.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - {name: trace_id, datasourceUid: tempo}
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2: {datasourceUid: loki, filterByTraceID: true}
      serviceMap: {datasourceUid: prometheus}
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - {name: trace_id, matcherRegex: '"trace_id":"(\w+)"', datasourceUid: tempo, url: "$${__value.raw}"}
