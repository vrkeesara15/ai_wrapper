# Prometheus for the stage 1 pilot (compose). In Kubernetes the chart's ServiceMonitors and PrometheusRule
# (prometheus-operator) replace this file; the alert rules are the same file content.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels: {environment: pilot}

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: aiready
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - gateway-admin:8081
          - guardrails:8090
          - governance:8091
          - embedding:8100
          - rerank:8101
          - search:8102
          - rag:8110
          - memory:8111
          - query:8112
          - agents:8120
          - assistant:8130
          - mcp:8140
          - identity-bridge:8150
          - facade:8151
          - ingestion:8160
          - observability:8170
    # No relabelling to `service`: every metric already carries the emitting service's own `service` label.

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]   # metrics received over OTLP (incl. ingestion worker)
        labels: {source: otlp}
      - targets: ["otel-collector:8888"]   # the collector's own health
        labels: {source: collector}

  # Model servers: vLLM exposes vllm:* metrics (tokens/s, queue time, KV-cache usage); TEI exposes te_*.
  - job_name: model-servers
    static_configs:
      - targets: ["vllm-chat:8000"]
        labels: {pool: chat}
      - targets: ["tei-embed:80", "tei-rerank:80"]
        labels: {pool: embed-rerank}

  - job_name: mock-models
    static_configs:
      - targets: ["mock-models:8200"]

  # GPU memory/utilisation. On a GPU host run dcgm-exporter (nvidia/dcgm-exporter) and add it here.
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
