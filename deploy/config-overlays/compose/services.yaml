# Overlay: service wiring for the Docker Compose pilot (stage 1). Hostnames are compose service names.
#
# Mounted as AIREADY_CONFIG_OVERLAY and deep-merged over the base config. A wiring name with a `url`
# is reached over HTTP; without one it runs in-process (see aiready.core.wiring). Each service only
# connects to what it uses, so listing every name here is harmless.
services:
  gateway:
    url: "http://gateway:8080"
  guardrails:
    url: "http://guardrails:8090"
  policy:
    url: "http://governance:8091"
  registry:
    url: "http://governance:8091"
  search:
    url: "http://search:8102"
  embedding:
    url: "http://embedding:8100"
  rerank:
    url: "http://rerank:8101"
  rag:
    url: "http://rag:8110"
  memory:
    url: "http://memory:8111"
  query:
    url: "http://query:8112"
  tools:
    url: "http://mcp:8140"
  agents:
    url: "http://agents:8120"
  observability:
    url: "http://observability:8170"

# Model-serving endpoints (OpenAI-compatible) for the gateway's upstream configuration to reference
# (e.g. `base_url: ${AIREADY_MODEL_CHAT_URL}`). The deployment sets the environment, so the same overlay
# serves the mock server, vLLM/TEI pools or a private endpoint without editing config.
model_servers:
  chat: "${AIREADY_MODEL_CHAT_URL:-http://mock-models:8200/v1}"
  small: "${AIREADY_MODEL_SMALL_URL:-http://mock-models:8200/v1}"
  embed: "${AIREADY_MODEL_EMBED_URL:-http://mock-models:8200/v1}"
  rerank: "${AIREADY_MODEL_RERANK_URL:-http://mock-models:8200/v1}"
  guard: "${AIREADY_MODEL_GUARD_URL:-http://mock-models:8200/v1}"

# Model pools served over HTTP (OpenAI-compatible). In the default compose profile every pool points at the
# mock model server; the `gpu` profile sets AIREADY_MODEL_*_URL to vLLM / TEI containers. "=replicas" replaces
# the in-process mock replicas of config/models.yaml.
models:
  pools:
    small-llm:
      model: ${AIREADY_MODEL_SMALL_NAME:-small}
      =replicas: [{type: openai, base_url: "${AIREADY_MODEL_SMALL_URL:-http://mock-models:8200/v1}", api_key: "${secret:llm_api_key}"}]
    mid-llm:
      model: ${AIREADY_MODEL_CHAT_NAME:-chat}
      =replicas: [{type: openai, base_url: "${AIREADY_MODEL_CHAT_URL:-http://mock-models:8200/v1}", api_key: "${secret:llm_api_key}"}]
    large-llm:
      model: ${AIREADY_MODEL_LARGE_NAME:-chat}
      =replicas: [{type: openai, base_url: "${AIREADY_MODEL_LARGE_URL:-http://mock-models:8200/v1}", timeout: 180, api_key: "${secret:llm_api_key}"}]
    embedding:
      =replicas: [{type: openai, base_url: "${AIREADY_MODEL_EMBED_URL:-http://mock-models:8200/v1}"}]
    reranker:
      =replicas: [{type: openai, base_url: "${AIREADY_MODEL_RERANK_URL:-http://mock-models:8200/v1}"}]
