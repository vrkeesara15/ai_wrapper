{{- /*
One ServiceAccount per workload: no shared identity, and no Kubernetes API token in any pod
(automountServiceAccountToken: false). Cloud IAM (IRSA / workload identity) is attached per account via
serviceAccount.annotations.<name>; Terraform's IRSA roles expect the names used here.
*/ -}}
{{- $names := list }}
{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}{{ $names = append $names $name }}{{ end }}
{{- end }}
{{- if .Values.modelServing.enabled }}{{ $names = append $names "model-loader" }}{{ end }}
{{- $names = append $names "batch" }}
{{- $names = append $names "backup" }}
{{- if .Values.egressProxy.enabled }}{{ $names = append $names "egress-proxy" }}{{ end }}
{{- if .Values.qdrant.enabled }}{{ $names = append $names "qdrant" }}{{ end }}
{{- if .Values.redis.enabled }}{{ $names = append $names "redis" }}{{ end }}
{{- if .Values.otelCollector.enabled }}{{ $names = append $names "otel-collector" }}{{ end }}
{{- if .Values.fineTuning.enabled }}{{ $names = append $names "finetune" }}{{ end }}
{{- range $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels:
    {{- include "aiready.labels" (dict "root" $ "name" . "zone" "platform") | nindent 4 }}
  {{- with (get $.Values.serviceAccount.annotations .) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
