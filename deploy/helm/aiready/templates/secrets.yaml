{{- /*
Secrets. existingSecret: nothing rendered (you create the Secret named secrets.existingSecret).
externalSecrets: an ExternalSecret that materialises that same Secret from the client's secret store.
vault: nothing rendered here; pods carry Vault agent injector annotations instead.
*/ -}}
{{- if eq .Values.secrets.mode "externalSecrets" }}
{{- $es := .Values.secrets.externalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "aiready.labels" (dict "root" . "name" "secrets" "zone" "platform") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range .Values.secrets.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s%s" $es.remoteKeyPrefix . }}
{{- end }}
{{- else if not (has .Values.secrets.mode (list "existingSecret" "vault")) }}
{{- fail (printf "secrets.mode must be existingSecret, externalSecrets or vault (got %q)" .Values.secrets.mode) }}
{{- end }}
