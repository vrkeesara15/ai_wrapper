{{- /* CPU HorizontalPodAutoscalers for components not scaled by KEDA. */ -}}
{{- range $name, $c0 := .Values.components }}
{{- if $c0.enabled }}
{{- $c := include "aiready.resolve" (dict "root" $ "c" $c0) | fromYaml }}
{{- $kedaOn := and $.Values.keda.enabled $c.keda $c.keda.enabled }}
{{- if and $c.hpa $c.hpa.enabled (not $kedaOn) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiready.labels" (dict "root" $ "name" $name "zone" $c.zone) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $c.hpa.minReplicas | default $.Values.defaults.hpa.minReplicas }}
  maxReplicas: {{ $c.hpa.maxReplicas | default $.Values.defaults.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.hpa.targetCPU | default $.Values.defaults.hpa.targetCPU }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - {type: Percent, value: 100, periodSeconds: 60}
{{- end }}
{{- end }}
{{- end }}
