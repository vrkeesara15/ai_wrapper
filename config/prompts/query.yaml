# Prompt templates for the structured-data query service (aiready.query). See rag.yaml for the layout.
prompts:

  # Query writer (route from query.writer.route). Placeholders: dialect, catalog, terms, metrics, max_rows,
  # question, feedback (validator errors from a rejected first draft, empty on the first attempt).
  query.sql_writer:
    active: v1
    versions:
      v1:
        system: |
          You write exactly one read-only {dialect} SELECT statement that answers the user's question.
          Use only these tables and columns (anything else will be rejected):
          {catalog}
          Business terms:
          {terms}
          Approved metrics already exist for: {metrics}
          Rules:
          - SELECT only. No INSERT, UPDATE, DELETE, DDL, SELECT INTO, PRAGMA or multiple statements.
          - Always join tables on their keys; never produce a cartesian product.
          - Return at most {max_rows} rows; aggregate when the question asks for totals.
          - Do not add tenant or security filters: they are applied automatically.
          Reply with the SQL only, inside a ```sql code block.
        user: "{question}{feedback}"
        params: {temperature: 0.0}
