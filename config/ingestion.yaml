# =====================================================================================================
# RAG ingestion platform (package aiready.ingestion; API port 8160, worker: python -m aiready.ingestion.worker)
#
#   Extract   connect (connector workers) -> detect changes (document registry) -> parse
#   Transform clean and classify -> chunk -> enrich (source, date, owner, access list on every chunk)
#   Load      embed (gateway, priority bulk) -> index (search upsert/delete) -> verify (test questions)
#
# Every swappable part is a plugin: connector, parser, chunker, ocr, landing_store, acl_resolver.
# Use {type: <built-in>} or {class: your_pkg.module:Class, ...} - no fork needed.
# The sources below target the sample app in examples/legacy_app.
# =====================================================================================================
ingestion:

  default_collection: default     # collection for event-driven documents of sources not listed below
  admin_roles: [ingestion-admin]  # roles allowed on the ingestion API (service principals are always allowed)
  scheduler_tick_seconds: 30

  # ---------------------------------------------------------------------------------------------------
  # Sources: one entry per source system. Each yields documents with access tags, owner, updated_at
  # and checksum; only new, changed and deleted items are processed on each run.
  # ---------------------------------------------------------------------------------------------------
  sources:

    # Policy wordings and handbooks on a file share (local path, or an SMB/NFS share mounted on the worker).
    - name: policy-docs
      collection: claims-kb
      schedule: every 15m           # "every 15m" | "interval:1h" | "@daily" | cron "*/10 6-20 * * 1-5"
      data_class: internal          # sensitivity floor for every chunk of the source
      require_access_tags: true     # fail closed: documents without an access list are not indexed
      detect_deletes: true          # files missing from a full crawl are removed from the index
      max_delete_fraction: 0.5      # ...unless more than half would go (an unmounted share is not a deletion)
      landing: true                 # keep raw copies for replay
      connector:
        type: filesystem
        root: ${LEGACY_DOCS_DIR:-examples/legacy_app/docs}
        include: ["*.md", "*.html", "*.pdf", "*.docx", "*.csv", "*.txt", "*.json", "*.xlsx"]
        exclude: ["~$*", "*.tmp"]
        max_file_mb: 50
        # Access list resolvers, merged in order (see aiready.integration.file_crawler):
        acl:
          - type: sidecar           # <file>.acl.json or <dir>/.acl.json: {groups, users, roles, owner, data_class}
          - type: path_map          # glob -> groups for folders without sidecars
            map:
              "public/**": [public]
          # - type: posix           # owner/group/world bits -> user:<owner>, <group>, world_tag
          #   world_tag: public
      # parsers: {".pdf": {type: pdf, ocr: {type: tesseract, lang: eng}}}   # per-source parser overrides
      # chunker: {type: heading, max_tokens: 300, overlap_tokens: 40}       # per-source chunker override
      verify:                       # test questions run after each load
        - question: What is the excess for escape of water claims?
          expect_doc_contains: home-policy-wording
          top_k: 3
        - question: Who approves claims above 5000 EUR settlement authority?
          expect_doc_contains: claims-handbook
          top_k: 3

    # Rows of the application database, read from the READ REPLICA (never the live primary).
    # A full reconcile once a day; change capture (config/integration.yaml) streams changes in between
    # under the same source name, so both paths share one registry and one set of document ids.
    - name: legacy-db
      collection: claims-records
      schedule: "@daily"
      data_class: personal
      connector:
        type: sql
        url: ${LEGACY_REPLICA_URL:-sqlite:///examples/legacy_app/data/legacy.db}
        primary_url: ${LEGACY_PRIMARY_URL:-}     # set it: the connector refuses to read the primary
        tables:
          - table: claims
            key_columns: [id]
            title_template: "Claim {claim_number}"
            content_template: "Claim {claim_number} ({status}) for {claimant}, amount {amount} EUR, region {region}: {description}"
            owner_column: handler
            uri_template: "legacy://claims/{claim_number}"
            # Search matches ANY tag: region tags reproduce "adjusters see their region",
            # fraud investigators see all claims. No broad static tag such as claims-team.
            access_tags: [fraud]
            access_tag_columns:
              - {column: region, template: "region:{value}"}
            access_rules:
              - when: {status: closed}
                tags: [service-team]
            data_class: personal
          - table: policies
            key_columns: [id]
            title_template: "Policy {number}"
            content_template: "Policy {number}: {product} insurance for {holder_name}, premium {premium} EUR, status {status}."
            uri_template: "legacy://policies/{number}"
            access_tags: [service-team, fraud]
            access_tag_columns:
              - {column: region, template: "region:{value}"}
            exclude_columns: []
            data_class: personal
      verify:
        - question: burst pipe water damage kitchen claim
          expect_doc_id: "legacy-db:claims:1"
          as_groups: [region:north]
          top_k: 5

    # A JSON REST endpoint with pagination (disabled: the sample app's API needs a user session, and
    # ingestion has no user; point it at an export endpoint with a read-only integration credential).
    - name: claims-api-export
      enabled: false
      collection: claims-records
      connector:
        type: http_json
        base_url: ${LEGACY_APP_URL:-http://localhost:8000}
        path: /api/claims
        items_path: items
        pagination: {type: page, page_param: page, size_param: page_size, page_size: 100, next_path: next_page}
        id_field: claim_number
        title_template: "Claim {claim_number}"
        content_template: "Claim {claim_number} ({status}): {description}"
        updated_at_field: updated_at
        access_tag_fields: [{field: region, template: "region:{value}"}]
        bearer_token: ${secret:legacy_export_token}

    # Wiki and ticket systems (disabled examples).
    - name: wiki
      enabled: false
      collection: claims-kb
      connector:
        type: confluence
        base_url: https://wiki.example.com
        spaces: [CLAIMS]
        read_space_permissions: true            # space read permissions -> access tags
        space_access: {CLAIMS: [claims-team]}   # explicit tags when permissions cannot be read
        bearer_token: ${secret:confluence_token}
    - name: tickets
      enabled: false
      collection: claims-kb
      connector:
        type: jira
        base_url: https://jira.example.com
        jql: "project = CLM AND updated >= -30d"
        project_access: {CLM: [claims-team]}
        security_level_access: {Fraud: [fraud]}
        basic: {username: "${JIRA_USER:-}", password: "${secret:jira_token}"}

  # ---------------------------------------------------------------------------------------------------
  # Chunking (plugin kind chunker: heading | fixed | table_rows | class: ...)
  # ---------------------------------------------------------------------------------------------------
  chunking:
    default: {type: heading, max_tokens: 350, overlap_tokens: 40, min_tokens: 20}
    by_mime:
      text/csv: {type: table_rows, rows_per_chunk: 20, max_tokens: 400}
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {type: table_rows, rows_per_chunk: 20}

  # ---------------------------------------------------------------------------------------------------
  # Clean and classify (personal data and injection detection via the guardrails service)
  # ---------------------------------------------------------------------------------------------------
  cleaning:
    pii_mode: tag              # mask: replace personal data before embedding | tag: mark chunks personal | off
    injection_action: flag     # flag: mark chunks injection_suspected | drop: quarantine the document
    injection_patterns: []     # extra regexes for indirect prompt injection
    boilerplate_patterns: []   # extra line regexes to strip (e.g. "^Acme Insurance - Internal$")
    repeated_line_ratio: 0.6   # a line on more than 60% of pages is a running header/footer

  # ---------------------------------------------------------------------------------------------------
  # Embedding (always through the gateway; bulk priority keeps re-indexing off the live queue)
  # ---------------------------------------------------------------------------------------------------
  embedding:
    model: embedding           # logical model / route name at the gateway
    batch_size: 64
    priority: bulk
    fingerprint: null          # e.g. "bge-m3@2024-06"; stamped on every chunk - a change means a full re-embed
    include_title: true        # embed "title > section" + text (stored text stays unchanged)

  # ---------------------------------------------------------------------------------------------------
  # Work queue, worker pool, dead letters
  # ---------------------------------------------------------------------------------------------------
  queue:
    spec: {type: memory}       # redis in production: {type: redis, url: redis://redis:6379/0}
    topic: ingestion.documents # change capture puts its messages on the same topic
    max_attempts: 3            # then the message goes to the dead-letter queue (permanent errors go at once)
    concurrency: 4             # documents processed in parallel per worker process
    poll_timeout: 1.0

  landing:                     # raw copies kept for replay (plugin kind landing_store)
    type: local                # local | s3
    path: data/landing
    keep_versions: 3
    # type: s3
    # bucket: aiready-landing
    # prefix: landing/

  alerts:
    webhook_url: null          # POSTed on verification failure, dead letters, quarantines, refused mass deletes
    log_level: WARNING
