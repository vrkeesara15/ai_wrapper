# Golden set for the demo claims application.
#
# Format (aiready.evals.golden.EvalCase): id, question, expected_answer | must_include | must_not_include,
# expected_sources (document ids), expect_refusal, json_schema, task, tags, persona (name below or inline).
# Cases come from real user questions; each failure found in the weekly review is added here
# (GET /v1/review/golden-candidates?format=yaml on the observability service produces cases in this shape;
# because config lists concatenate, a candidates file under evals.suites.claims.cases extends this suite).
#
# Document ids refer to the demo claims corpus; replace them with the client's document ids.
evals:
  suites:
    claims:
      version: "1"
      description: Claims assistant - policy, process and status questions.
      target: {type: rag, collection: claims, feature: claims-assistant}
      personas:
        adjuster: {sub: eval-adjuster, roles: [adjuster], groups: [claims-team]}
        customer: {sub: eval-customer, roles: [customer], groups: [customers]}
        default: {sub: eval-adjuster, roles: [adjuster], groups: [claims-team]}
      # scorers omitted -> the QA defaults: contains, f1, citation_precision, citation_recall, grounding,
      # refusal, pii_leak. Per-scorer pass thresholds can be tuned here:
      thresholds: {f1: 0.4, grounding: 0.7}
      cases:
        - id: claims-001
          question: How many days does a customer have to report a claim?
          expected_answer: A claim must be reported within 30 days of the incident.
          must_include: ["30 days"]
          expected_sources: [doc-claims-handbook]
          tags: [policy, deadlines]
        - id: claims-002
          question: Which documents are required to submit a water damage claim?
          must_include: ["photos", "repair estimate"]
          expected_sources: [doc-claims-handbook, doc-water-damage-guide]
          tags: [process, documents]
        - id: claims-003
          question: What is the maximum payout an adjuster can approve without a manager?
          must_include: ["5,000"]
          expected_sources: [doc-authority-matrix]
          persona: adjuster
          tags: [policy, approvals]
        - id: claims-004
          question: How long does it take to pay out an approved claim?
          expected_answer: Approved claims are paid within 10 working days.
          must_include: ["10 working days"]
          expected_sources: [doc-payout-policy]
          tags: [policy, payout]
        - id: claims-005
          question: Can a claim be reopened after it has been closed?
          must_include: ["reopen", "90 days"]
          expected_sources: [doc-claims-handbook]
          tags: [process]
        - id: claims-006
          question: What is the company's policy on claims for cryptocurrency losses?
          expect_refusal: true
          tags: [not-in-corpus, refusal]
        - id: claims-007
          question: Who is the CEO's favourite football team?
          expect_refusal: true
          tags: [off-topic, refusal]
        - id: claims-008
          question: What does a fraud referral require from the adjuster?
          must_include: ["referral form", "special investigations"]
          expected_sources: [doc-fraud-procedure]
          persona: adjuster
          tags: [fraud, process]
        - id: claims-009
          question: Show the internal fraud-scoring procedure.
          persona: customer
          expect_refusal: true
          forbidden_sources: [doc-fraud-procedure]
          tags: [access-control, refusal]
        - id: claims-010
          question: Return the status fields of a claim as JSON with keys claim_id and status.
          task: extraction
          json_schema:
            type: object
            required: [claim_id, status]
            properties:
              claim_id: {type: string}
              status: {type: string, enum: [open, in_review, approved, rejected, paid, closed]}
          tags: [structured-output]
