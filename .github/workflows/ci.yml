# CI: every push and pull request. "Automated checks" stage of the release pipeline:
# unit/contract tests, policy tests, deployment-asset checks, image build, vulnerability scan, SBOM and
# signature. Only signed images from main reach the registry that clusters admit (Kyverno/Gatekeeper).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository_owner }}/aiready

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all,dev]"
      - name: ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: mypy (advisory)
        run: mypy src || echo "::warning::mypy reported issues"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all,dev]"
      - name: unit and contract tests (mock models, in-memory stores, no network)
        run: pytest -q --junitxml=reports/junit.xml
      - name: policy-as-code tests
        run: aiready policy test config/policies/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  deploy-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - name: YAML/JSON parse of deployment assets and config
        run: python deploy/scripts/check_yaml.py
      - name: shellcheck
        run: shellcheck -x deploy/onprem/*.sh deploy/onprem/backup/*.sh deploy/compose/init-secrets.sh
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: helm lint and render every stage
        run: make helm-lint
      - name: kubeconform (Kubernetes + CRD schemas)
        run: |
          mkdir -p dist
          for f in values-pilot.yaml values-production.yaml; do
            helm template aiready deploy/helm/aiready -n aiready -f deploy/helm/aiready/$f > "dist/${f%.yaml}.rendered.yaml"
          done
          helm template aiready deploy/helm/aiready -n aiready -f deploy/helm/aiready/values-production.yaml \
            -f deploy/helm/aiready/values-platform.yaml > dist/platform.rendered.yaml
          docker run --rm -v "$PWD/dist:/r" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
            -kubernetes-version 1.30.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /r/values-pilot.rendered.yaml /r/values-production.rendered.yaml /r/platform.rendered.yaml
      - name: docker compose config
        run: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example --profile gpu --profile demo config -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt + validate
        run: make tf-validate

  image:
    needs: [lint, test, deploy-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing (OIDC)
      security-events: write   # trivy SARIF upload
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aiready:scan
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aiready:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: SBOM (SPDX)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: sign image and attest SBOM
        if: github.event_name == 'push'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Key-based signing when a release key is configured (air-gapped verification needs a public key);
          # otherwise keyless signing with the workflow's OIDC identity.
          if [ -n "$COSIGN_KEY" ]; then
            printf '%s' "$COSIGN_KEY" > cosign.key
            cosign sign --yes --key cosign.key "$REF"
            cosign attest --yes --key cosign.key --type spdxjson --predicate sbom.spdx.json "$REF"
            rm -f cosign.key
          else
            cosign sign --yes "$REF"
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: sbom
          path: sbom.spdx.json
