[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aiready"
version = "0.1.0"
description = "AI-ready applications: a plug-and-play AI foundation deployed beside existing applications (gateway, RAG, agents, MCP, governance)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "sqlglot>=23.0",
  "typer>=0.12",
  "rich>=13.0",
  "prometheus-client>=0.20",
  "jsonschema>=4.21",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
qdrant = ["qdrant-client>=1.9"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
otel = [
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
]
mcp = ["mcp>=1.2"]
parsers = ["pypdf>=4.0", "beautifulsoup4>=4.12", "python-docx>=1.1"]
kafka = ["aiokafka>=0.10"]
all = ["aiready[redis,qdrant,postgres,otel,mcp,parsers,kafka]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
aiready = "aiready.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
